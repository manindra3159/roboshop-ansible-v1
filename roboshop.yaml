- name: create ec2 instance and r53 record 
  hosts: local 
  connection: local 
  vars: 
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: mani315.store
    ami_id: ami-0055977a6e828a4f4
  tasks: 
    - name: create ec2 instance 
      amazon.aws.ec2_instance:
       name: "roboshop-{{ item }}"
       image_id: "{{ ami_id }}"
       instacne_type: t3.micro 
       secuirty_groups:
       - Roboshop_common
       - "roboshop-{{ item }}"
      region: us-east-1
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output 
