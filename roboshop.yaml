- name: create ec2 instance and r53 record 
  hosts: local 
  connection: local 
  vars: 
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: mani315.store
    ami_id: ami-0055977a6e828a4f4
  tasks: 
  - name: create ec2 instances 
    amazon.aws.ec2_instance:
       name: "roboshop-{{ item }}"
       image_id: "{{ ami_id }}"
       instance_type: t3.micro 
       security_groups:
       - Roboshop_common
       - "roboshop-{{ item }}"
       region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output 
  
  - name: create R53 record 
    amazon.aws.route53:
       state: present 
       zone: "{{ domain_name }}"
       record: "{{ item }}.{{ domain_name }}"
       type: A
       ttl: 1 
       value: "{{ item.instance[0].private_ip_address }}"
       overwrite: true 
    loop: "{{ instances }}"
    when: action == "create"
     
  - name: delete R53 record
    amazon.aws.route53:
       state: absent 
       zone: "{{ domain_name }}"
       record: "{{ item }}.{{ domain_name }}"
       type: A 
       ttl: 1 
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete ec2 instances
    amazon.aws.ec2_instance: 
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"
