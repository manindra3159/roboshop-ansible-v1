- name: configure rabbitmq server
  hosts: rabbitmq 
  become: yes  
  tasks: 
   - name: copy rabbitmq repo 
     copy: 
       src: rabbitmq.repo 
       dest: /etc/yum.repos.d/rabbitmq.repo 


   - name: install rabbitmq server
     dnf: 
       name: 
        - erlang 
        - rabbitmq-server
       state:present 

   - name: enable and start rabbitmq server
     service: 
      name: rabbitmq-server
      state: started
      enable: yes 

      

